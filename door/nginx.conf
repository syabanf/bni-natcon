server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cover art and speaker photos come straight off a phone, so they are
    # megabytes, not kilobytes. nginx defaults to a 1 MB body: without this
    # line it cuts the upload off before the API ever sees it, and the browser
    # is told 502 by a gateway that never reached anything. 6m matches the
    # API's own ceiling (5 MB per image, plus multipart overhead).
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # The app lives under /door/ — see door/vite.config.js. alias maps that
    # prefix onto the bundle, and the fallback keeps a deep link working.
    location /door/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /door/index.html;
    }

    # /door without the slash is the same place; keep the app's own address
    # canonical rather than bouncing the crew to the sign-in they may not need.
    location = /door {
        return 302 /door/;
    }

    # Anything else on this host is somebody who typed the bare address, or a
    # bookmark from before the app had a path of its own.
    location / {
        return 302 /door/login;
    }
}
