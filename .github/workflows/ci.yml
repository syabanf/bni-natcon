name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (vet + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  e2e:
    name: End-to-end suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: natcon
          POSTGRES_PASSWORD: natcon
          POSTGRES_DB: natcon_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U natcon -d natcon_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build API
        working-directory: backend
        run: go build -o /tmp/natcon-api ./cmd/api
      - name: Run API + e2e suite
        env:
          ADDR: ":8082"
          DATABASE_URL: postgres://natcon:natcon@localhost:5432/natcon_e2e?sslmode=disable
          BASE: http://localhost:8082
        run: |
          /tmp/natcon-api &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8082/healthz && break
            sleep 1
          done
          python3 scripts/e2e.py
          kill $API_PID

  stress:
    name: Stress & concurrency suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: natcon
          POSTGRES_PASSWORD: natcon
          POSTGRES_DB: natcon_stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U natcon -d natcon_stress"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build API
        working-directory: backend
        run: go build -o /tmp/natcon-api ./cmd/api
      - name: Run API + stress suite
        env:
          ADDR: ":8083"
          DATABASE_URL: postgres://natcon:natcon@localhost:5432/natcon_stress?sslmode=disable
          BASE: http://localhost:8083
        run: |
          /tmp/natcon-api &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8083/healthz && break
            sleep 1
          done
          python3 scripts/stress.py
          kill $API_PID

  frontend:
    name: Frontend builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin, door]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  apk:
    name: Android APK (attendee + booth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the APK
        env:
          # No secret: the workflow only proves the APK still builds. The one
          # people install is built against the real API — see docs/ANDROID.md.
          VITE_API_URL: https://api.natcon.example.com
        run: scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: natcon2026-apk-debug
          path: dist/natcon2026-debug.apk
          if-no-files-found: error

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
