# Resource posture for event day (3 September 2026). This host runs ~89
# containers including GitLab, and the kernel OOM-killed 73 processes in the
# 30 days before the event. cpu_shares wins CPU contention against neighbours,
# mem_limit is a runaway backstop (not a tight fit), and the negative
# oom_score_adj tells the kernel to reach for something else first.
# Semua variabel bisa dioverride lewat file `.env` di root repo
# (lihat .env.example) — tanpa .env pun default di bawah sudah jalan.
services:
  db:
    image: postgres:16-alpine
    container_name: natcon-db
    restart: unless-stopped
    # The database is the one component whose loss is unrecoverable mid-event.
    cpu_shares: 4096
    mem_limit: 2g
    mem_reservation: 512m
    oom_score_adj: -700
    environment:
      POSTGRES_USER: ${DB_USER:-natcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-natcon}
      POSTGRES_DB: ${DB_NAME:-natcon}
    # Every API replica keeps its OWN pool, so the connection budget is
    # replicas x DB_MAX_CONNS. The stock 100 is reached at four replicas of
    # the default pool, and running out looks like the API failing to start
    # at the worst possible moment.
    command: ["postgres", "-c", "max_connections=${DB_MAX_CONNECTIONS:-200}"]
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - natcon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-natcon} -d ${DB_NAME:-natcon}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Several of these sit behind the `lb` service below. No container_name and
  # no host port: both are single-instance-only, and the balancer is the way
  # in. Scale with API_REPLICAS in .env, or `docker compose up -d --scale
  # api=5`.
  api:
    build: ./backend
    restart: unless-stopped
    deploy:
      # Two, not more, unless there is CPU to back it. Replicas do not make a
      # fixed machine faster — one Go process already uses every core, and
      # measured on a 4-CPU host three replicas were SLOWER than one. What
      # they buy is that a container dying mid-event does not take the day
      # with it, and that a deploy can roll.
      replicas: ${API_REPLICAS:-2}
    cpu_shares: 4096
    mem_limit: 2g
    mem_reservation: 512m
    oom_score_adj: -600
    environment:
      DATABASE_URL: postgres://${DB_USER:-natcon}:${DB_PASSWORD:-natcon}@db:5432/${DB_NAME:-natcon}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      APP_ENV: ${APP_ENV:-development}
      SEED_PASSWORD: ${SEED_PASSWORD:-natcon2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:8089}
      UPLOAD_DIR: /data/uploads
      # PER REPLICA. Multiply by the replica count and keep it under the
      # database's max_connections above. Ten is generous: these queries are
      # index lookups in tens of microseconds, so what matters is having a
      # connection free, not having many.
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
    volumes:
      - natcon-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget, already in the alpine runtime image — no curl to add.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 40s

  # The only way to the API — see deploy/api-lb.conf.
  lb:
    image: nginx:1.27-alpine
    container_name: natcon-lb
    restart: unless-stopped
    volumes:
      - ./deploy/api-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "${API_PORT:-8090}:80"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8089}
        VITE_DOOR_URL: ${VITE_DOOR_URL:-http://localhost:8087/door/login}
    container_name: natcon-frontend
    restart: unless-stopped
    cpu_shares: 2048
    mem_limit: 256m
    oom_score_adj: -400
    depends_on:
      - lb
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  admin:
    build: ./admin
    container_name: natcon-admin
    restart: unless-stopped
    cpu_shares: 2048
    mem_limit: 256m
    oom_score_adj: -400
    depends_on:
      - lb
    ports:
      - "${ADMIN_PORT:-8089}:80"

  door:
    build: ./door
    container_name: natcon-door
    restart: unless-stopped
    cpu_shares: 2048
    mem_limit: 256m
    oom_score_adj: -400
    depends_on:
      - lb
    ports:
      - "${DOOR_PORT:-8087}:80"

volumes:
  natcon-pgdata:
  natcon-uploads:
