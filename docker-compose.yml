# Resource posture for event day (3 September 2026). This host runs ~89
# containers including GitLab, and the kernel OOM-killed 73 processes in the
# 30 days before the event. cpu_shares wins CPU contention against neighbours,
# mem_limit is a runaway backstop (not a tight fit), and the negative
# oom_score_adj tells the kernel to reach for something else first.
# Semua variabel bisa dioverride lewat file `.env` di root repo
# (lihat .env.example) — tanpa .env pun default di bawah sudah jalan.
services:
  db:
    image: postgres:16-alpine
    container_name: natcon-db
    restart: unless-stopped
    # The database is the one component whose loss is unrecoverable mid-event.
    cpu_shares: 4096
    mem_limit: 2g
    mem_reservation: 512m
    oom_score_adj: -700
    environment:
      POSTGRES_USER: ${DB_USER:-natcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-natcon}
      POSTGRES_DB: ${DB_NAME:-natcon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - natcon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-natcon} -d ${DB_NAME:-natcon}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: natcon-api
    restart: unless-stopped
    cpu_shares: 4096
    mem_limit: 2g
    mem_reservation: 512m
    oom_score_adj: -600
    environment:
      DATABASE_URL: postgres://${DB_USER:-natcon}:${DB_PASSWORD:-natcon}@db:5432/${DB_NAME:-natcon}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      APP_ENV: ${APP_ENV:-development}
      SEED_PASSWORD: ${SEED_PASSWORD:-natcon2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:8089}
      UPLOAD_DIR: /data/uploads
    volumes:
      - natcon-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8090}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8089}
    container_name: natcon-frontend
    restart: unless-stopped
    cpu_shares: 2048
    mem_limit: 256m
    oom_score_adj: -400
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  admin:
    build: ./admin
    container_name: natcon-admin
    restart: unless-stopped
    cpu_shares: 2048
    mem_limit: 256m
    oom_score_adj: -400
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8089}:80"

  door:
    build: ./door
    container_name: natcon-door
    # Door staff scan every arriving attendee here; if this dies unattended
    # the queue stops. It was the only service left without a restart policy.
    restart: unless-stopped
    cpu_shares: 2048
    mem_limit: 256m
    oom_score_adj: -400
    depends_on:
      - api
    ports:
      - "${DOOR_PORT:-8087}:80"

volumes:
  natcon-pgdata:
  natcon-uploads:
