# Semua variabel bisa dioverride lewat file `.env` di root repo
# (lihat .env.example) — tanpa .env pun default di bawah sudah jalan.
services:
  db:
    image: postgres:16-alpine
    container_name: natcon-db
    environment:
      POSTGRES_USER: ${DB_USER:-natcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-natcon}
      POSTGRES_DB: ${DB_NAME:-natcon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - natcon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-natcon} -d ${DB_NAME:-natcon}"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: natcon-api
    environment:
      DATABASE_URL: postgres://${DB_USER:-natcon}:${DB_PASSWORD:-natcon}@db:5432/${DB_NAME:-natcon}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      APP_ENV: ${APP_ENV:-development}
      SEED_PASSWORD: ${SEED_PASSWORD:-natcon2026}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:8089}
      UPLOAD_DIR: /data/uploads
    volumes:
      - natcon-uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8090}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8089}
    container_name: natcon-frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  admin:
    build: ./admin
    container_name: natcon-admin
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8089}:80"

volumes:
  natcon-pgdata:
  natcon-uploads:
