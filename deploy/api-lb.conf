# The load balancer in front of the API.
#
# It is the only way in: the API containers have no host port of their own,
# and the three front ends proxy here rather than at a single replica — one
# balancing layer, in one file, is easier to reason about at 08:30 than three
# nginx images each quietly picking their own favourite instance.
#
# WHY THE RESOLVER, AND WHY proxy_pass TAKES A VARIABLE
# -----------------------------------------------------
# `proxy_pass http://api:8080` would look the name up ONCE, at start-up, and
# keep the first address it was given for the life of the process. Docker's
# DNS returns every replica, so that would pin all traffic to one container
# and quietly undo the whole point of scaling. Naming Docker's embedded
# resolver and passing the upstream through a VARIABLE makes nginx re-resolve
# on the interval below, so replicas that come and go — a restart, a scale up
# before the doors open — are picked up without touching this file.

server {
    listen 80;

    # Docker's embedded DNS. `valid=10s` is how quickly a replica that has
    # just come up starts receiving traffic.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Deliberately ABOVE the API's own 5 MB-per-image ceiling. nginx rejects
    # an oversized body with a bare HTML page naming no limit; the API answers
    # with "image must be under 5 MB", which is what the admin panel shows
    # somebody who picked a photo straight off their camera. Leaving room here
    # keeps the useful message; nginx only catches the absurd.
    client_max_body_size 12m;

    # The morning sign-in is bcrypt-bound and deliberately slow — a request
    # can legitimately sit for seconds while a hall signs in at once. These
    # are well above the API's own 30s handler timeout so that the timeout
    # the client sees is the API's considered answer, not the proxy giving up
    # first and reporting a 504 for a request that was going to succeed.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter reads this. It must carry the ORIGINAL client, so
        # append rather than replace — $proxy_add_x_forwarded_for keeps
        # whatever the front-end nginx already put there.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An instance that is restarting should cost the request a retry on
        # its neighbour, not a 502 in somebody's hand.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # The balancer's own liveness, answered without touching the API: it says
    # whether there is a front door, not whether the kitchen is open.
    location = /lb-health {
        access_log off;
        return 200 "ok\n";
    }
}
