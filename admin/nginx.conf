# Cloudflare Tunnel terminates inside cloudflared, so $remote_addr here is the
# tunnel container's address — byte-identical for every visitor on earth. The
# API keys its login rate limiter on the IP nginx reports, so forwarding
# $remote_addr handed the entire event one shared 10-attempts-per-minute bucket
# and attendee #11 got a 429. CF-Connecting-IP carries the true client address.
# Falling back to $remote_addr keeps the header non-empty for direct/local
# access, because an empty X-Real-IP collapses everyone into one bucket again.
map $http_cf_connecting_ip $natcon_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Cover art and speaker photos come straight off a phone, so they are
    # megabytes, not kilobytes. nginx defaults to a 1 MB body, which would cut
    # the upload off before the API ever saw it.
    # Deliberately ABOVE the API's own 5 MB-per-image ceiling, not equal to
    # it. nginx rejects an oversized body with a bare HTML page that names no
    # limit; the API answers with "image must be under 5 MB" and the admin
    # panel shows it. Leaving room here means the API is the one that
    # answers for anything a phone camera could plausibly produce, and nginx
    # only catches the absurd.
    client_max_body_size 12m;

    # Docker's embedded DNS, so a balancer that restarts is found again
    # rather than cached as a dead address for the life of this process.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin build pakai base=/admin/ — dilayani di bawah path /admin
    # (dipakai lewat bni-natcon.reddie.id/admin, proxy dari frontend member).
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        # Through a variable, or the resolver above is decoration: nginx
        # would look the balancer up once at start-up and keep that address
        # even after the container came back on a different one.
        set $api_upstream http://lb:80;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $natcon_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        set $uploads_upstream http://lb:80;
        proxy_pass $uploads_upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback (akses langsung via subdomain)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
